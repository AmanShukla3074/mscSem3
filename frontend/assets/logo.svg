<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Shield Border Gradient (Agricultural Emerald to Safety Cyan) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glowing Crop/Radar Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Squircle / App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Outer Security Radar Reticle Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4" />

  <!-- The Protective Shield Silhouette (Rakshak Guard) -->
  <path d="M256 90 L370 145 C370 260, 318 350, 256 405 C194 350, 142 260, 142 145 Z" 
        fill="#0A1E24" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Inner Surveillance Reticle Crosshairs -->
  <line x1="256" y1="130" x2="256" y2="165" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="345" x2="256" y2="380" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <line x1="165" y1="245" x2="200" y2="245" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <line x1="312" y1="245" x2="347" y2="245" stroke="#10B981" stroke-width="4" stroke-linecap="round" />

  <!-- Center Agricultural Wheat Leaf Symbol (Fasal) -->
  <!-- Central Sprout Vein -->
  <path d="M256 340 Q256 220, 256 175" fill="none" stroke="url(#glowGrad)" stroke-width="7" stroke-linecap="round" />
  
  <!-- Right Leaf Blades -->
  <path d="M256 280 C290 270, 310 240, 305 215 C285 220, 265 245, 256 260" fill="url(#glowGrad)" />
  <path d="M256 230 C280 220, 295 195, 290 180 C275 185, 260 205, 256 215" fill="url(#glowGrad)" />
  
  <!-- Left Leaf Blades -->
  <path d="M256 280 C222 270, 202 240, 207 215 C227 220, 247 245, 256 260" fill="url(#glowGrad)" />
  <path d="M256 230 C232 220, 217 195, 222 180 C237 185, 252 205, 256 215" fill="url(#glowGrad)" />

  <!-- Center Active Sentinel AI Sensor Dot -->
  <circle cx="256" cy="245" r="7.5" fill="#EF4444" filter="url(#subtleGlow)" />
  <circle cx="256" cy="245" r="3.5" fill="#FFFFFF" />
</svg>
